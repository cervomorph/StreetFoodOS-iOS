name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  build:
    name: Compile (iOS, no signing)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Crypto self-check (host, no simulator)
        run: |
          set -euo pipefail
          mkdir -p /tmp/sccheck
          cp Support/CryptoSelfCheck.swift /tmp/sccheck/main.swift
          swiftc -O -o /tmp/sfos-crypto-check /tmp/sccheck/main.swift Sources/Offline/CacheCrypto.swift
          /tmp/sfos-crypto-check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS (signing disabled)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project StreetFoodOS.xcodeproj \
            -scheme StreetFoodOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
