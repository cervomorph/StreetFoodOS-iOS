name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  testflight:
    name: Archive, sign, upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare ASC API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" | tr -d '\n\r ' | openssl base64 -d -A > "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::Decoded ASC key does not look like a .p8 — check the ASC_KEY_P8 secret encoding"
            exit 1
          fi
          echo "ASC key file prepared."
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project StreetFoodOS.xcodeproj \
            -scheme StreetFoodOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StreetFoodOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to TestFlight
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StreetFoodOS.xcarchive" \
            -exportOptionsPlist Support/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
