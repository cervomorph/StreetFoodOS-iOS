name: TestFlight

# On demand only (2026-10-19, Kit): a TestFlight upload is a deliberate release
# action. A tag push must never spend macOS minutes or push a build by itself.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  testflight:
    name: Archive, sign, upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare ASC API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" | tr -d '\n\r ' | openssl base64 -d -A > "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::Decoded ASC key does not look like a .p8 — check the ASC_KEY_P8 secret encoding"
            exit 1
          fi
          echo "ASC key file prepared."
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project StreetFoodOS.xcodeproj \
            -scheme StreetFoodOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StreetFoodOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)"

      - name: Verify the association in the signed archive
        run: |
          APP="$RUNNER_TEMP/StreetFoodOS.xcarchive/Products/Applications/StreetFoodOS.app"
          echo "pbxproj CODE_SIGN_ENTITLEMENTS refs: $(grep -c CODE_SIGN_ENTITLEMENTS StreetFoodOS.xcodeproj/project.pbxproj || true)"
          echo "entitlements file: $(ls -l Support/StreetFoodOS.entitlements 2>&1)"
          ls -d "$APP" || echo "APP PATH MISSING"
          echo "--- entitlements (stdout) ---"
          codesign -d --entitlements :- "$APP" > /tmp/ent.out 2>/tmp/ent.err || true
          cat /tmp/ent.out || true
          echo "--- entitlements (stderr) ---"
          cat /tmp/ent.err || true
          cp /tmp/ent.out /tmp/ent.plist 2>/dev/null || true
          grep -q associated-domains /tmp/ent.err && echo "ASSOC: PRESENT (stderr)" || true
          echo "--- association check ---"
          if grep -q "associated-domains" /tmp/ent.plist; then echo "ASSOC: PRESENT"; else echo "ASSOC: MISSING"; fi
          if grep -q "webcredentials:app.streetfoodos.com" /tmp/ent.plist; then echo "DOMAIN: app.streetfoodos.com"; else echo "DOMAIN: MISSING"; fi

      - name: Export and upload to TestFlight
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StreetFoodOS.xcarchive" \
            -exportOptionsPlist Support/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
